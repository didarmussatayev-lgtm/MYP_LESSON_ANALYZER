# Таксономия для LLM-классификации.
# Это конфиг, а не код — методист/координатор MYP может редактировать
# формулировки и примеры без изменения src/*.py.

question_categories:
  recall:
    definition: >
      Вопрос требует воспроизведения известного факта, определения или ранее
      сообщённой информации. Один правильный ответ, извлекаемый из памяти.
    examples:
      - "Как называется этот процесс?"
      - "Какой год начала Второй мировой войны?"
  understanding:
    definition: >
      Вопрос требует объяснить, перефразировать своими словами или
      интерпретировать смысл понятия/явления, не просто вспомнить факт.
    examples:
      - "Своими словами объясни, что значит этот термин."
      - "Почему, по-твоему, автор выбрал именно такую метафору?"
  application:
    definition: >
      Вопрос требует применить известное правило/концепцию к новой,
      конкретной ситуации или задаче.
    examples:
      - "Как бы вы использовали эту формулу для расчёта площади этого участка?"
      - "Что произойдёт, если применить этот закон к данному случаю?"
  analysis:
    definition: >
      Вопрос требует разложить на составляющие, сравнить, найти причинно-
      следственные связи, оценить доказательства или аргументы.
    examples:
      - "Какие доказательства подтверждают эту гипотезу, а какие противоречат?"
      - "В чём разница между этими двумя подходами и почему она возникает?"

inquiry_levels:
  level_1:
    name: "Teacher asks - student answers"
    definition: >
      Учитель задаёт закрытый вопрос, ученик даёт прямой ответ.
      Инициатива и структура полностью у учителя.
  level_2:
    name: "Teacher gives question - student investigates"
    definition: >
      Учитель формулирует вопрос/задачу, но дальнейшее исследование
      (поиск ответа, эксперимент, обсуждение в группе) выполняют ученики
      самостоятельно.
  level_4:
    name: "Student formulates - investigates - evaluates - reflects"
    definition: >
      Ученики сами формулируют вопрос исследования, самостоятельно ищут
      информацию/проводят эксперимент, оценивают полученные результаты и
      рефлексируют над процессом. Учитель в роли фасилитатора.
  # level_3 намеренно не определён - уточнить со школьным координатором MYP,
  # если понадобится промежуточный уровень.

atl_skill_clusters:
  thinking:
    label: "Thinking skills"
    subtypes: ["critical thinking", "creative thinking", "reflective thinking", "transfer"]
    indicators:
      - "Сравнение и оценка нескольких точек зрения/результатов"
      - "Построение гипотезы и её проверка"
      - "Перенос понятия из одного контекста в другой"
  research:
    label: "Research skills"
    subtypes: ["information literacy", "media literacy"]
    indicators:
      - "Поиск, отбор и оценка достоверности источников"
      - "Формулирование исследовательского вопроса"
  communication:
    label: "Communication skills"
    subtypes: ["exchanging information", "literacy"]
    indicators:
      - "Чёткое изложение идеи вслух или письменно"
      - "Активное слушание и уточняющие вопросы"
  social:
    label: "Social/Collaboration skills"
    subtypes: ["collaboration"]
    indicators:
      - "Совместная работа над общей задачей"
      - "Распределение ролей в группе"
  self_management:
    label: "Self-management skills"
    subtypes: ["organization", "affective", "reflection"]
    indicators:
      - "Планирование своих действий перед выполнением задачи"
      - "Саморефлексия по поводу качества своей работы"

alignment_labels:
  - "Strong"
  - "Partial"
  - "Not observed"
